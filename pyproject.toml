[project]
name = "telecursor"
version = "0.1.0"
description = "Forward Telegram DMs to the Cursor Agent CLI and pipe formatted results back."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Sam Dhar", email = "sam@vaani.us" },
]
keywords = [
    "telegram",
    "cursor",
    "agent",
    "bot",
    "ai",
    "llm",
    "automation",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
    "Typing :: Typed",
]

dependencies = [
    "python-telegram-bot[ext]>=21.6,<23",
    "python-dotenv>=1.0",
    "telegramify-markdown>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/samdhar/telecursor"
Repository = "https://github.com/samdhar/telecursor"
Issues = "https://github.com/samdhar/telecursor/issues"

[project.scripts]
telecursor = "telecursor.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["telecursor*"]
